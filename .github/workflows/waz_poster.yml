name: "Islamic Waz 24/7 Automated Short Reels Poster"

on:
  schedule:
    # Runs every 20 minutes (~72 reels per day)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual Trigger Confirmation'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  post-waz-reel:
    name: Process & Publish Real-Scene Islamic Waz Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Islamic Waz Reel Engine & Publish
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python waz_runner.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "Waz-Auto-Poster-Bot"
          git config --global user.email "waz-bot@users.noreply.github.com"
          git pull --rebase || true
          git add posted_waz_history.json replied_comments.json || true
          git commit -m "chore: update posted waz history [skip ci]" || exit 0
          git push origin main || true
