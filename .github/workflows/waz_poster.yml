name: "Jannat 4 Daily Islamic Waz Reels (Noon & Evening)"

on:
  schedule:
    # দুপুরে ২টি পোস্ট: বাংলাদেশ সময় দুপুর ১২:৪৫ ও ০২:১৫ (UTC 06:45 ও 08:15)
    - cron: '45 6,8 * * *'
    # সন্ধ্যায় ২টি পোস্ট: বাংলাদেশ সময় সন্ধ্যা ০৬:৪৫ ও রাত ০৮:৪৫ (UTC 12:45 ও 14:45)
    - cron: '45 12,14 * * *'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual Trigger Confirmation'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  post-waz-reel:
    name: Process & Publish Real-Scene Islamic Waz Reel to Jannat
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Deno (Official JS challenge solver for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Changes to Prevent Merge Conflicts
        run: |
          git pull --rebase origin main || true

      - name: Execute Islamic Waz Reel Engine & Publish to Jannat
        env:
          PYTHONUNBUFFERED: "1"
          FB_PAGE_ID: "1251877234677514"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python waz_runner.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "Waz-Auto-Poster-Bot"
          git config --global user.email "waz-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add posted_waz_history.json replied_comments.json || true
          git commit -m "chore: update posted waz history & daily stats [skip ci]" || exit 0
          git push origin main || true
