name: "Islamic Waz 24/7 Automated Short Reels Poster"

on:
  schedule:
    # Runs every 15 minutes = ~96-100 reels per day
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual Trigger Confirmation'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  post-waz-reel:
    name: Download, Process & Publish Islamic Waz Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp

      - name: Execute Islamic Waz Reel Engine & Publish
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python waz_runner.py
