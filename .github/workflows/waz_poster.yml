name: "Islamic Waz 10 Daily High-Definition Reels & Videos"

on:
  schedule:
    # সকালের ২টি স্লট: বাংলাদেশ সময় সকাল ০৭:৩০ ও ০৯:৩০ (UTC 01:30 & 03:30)
    - cron: '30 1,3 * * *'
    # দুপুরের পর থেকে প্রতি ১ ঘণ্টা পর পর ৮টি স্লট: দুপুর ০১:০০ থেকে রাত ০৮:০০ পর্যন্ত (UTC 07:00 to 14:00)
    - cron: '0 7-14 * * *'
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: 'Manual Trigger Confirmation'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  post-waz-reel:
    name: Process & Publish Real-Scene Islamic Waz Reel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Deno (Official JS challenge solver for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Changes to Prevent Merge Conflicts
        run: |
          git pull --rebase origin main || true

      - name: Execute Islamic Waz Reel Engine & Publish
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python waz_runner.py

      - name: Commit & Push History Updates
        run: |
          git config --global user.name "Waz-Auto-Poster-Bot"
          git config --global user.email "waz-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add posted_waz_history.json replied_comments.json || true
          git commit -m "chore: update posted waz history & daily stats [skip ci]" || exit 0
          git push origin main || true
